<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragX - Гараж и Избор на кола</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        h1 {
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b20710;
        }

        .action-btn-group button {
            margin: 5px;
            width: 45%;
        }

        .btn-green { background-color: #4bb543; }
        .btn-green:hover { background-color: #3e9935; }
        .btn-blue { background-color: #007bff; }
        .btn-blue:hover { background-color: #0069d9; }

        .switch-btn {
            background: transparent;
            color: #aaa;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .switch-btn:hover {
            color: white;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .msg {
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .error { color: #ff4d4d; }
        .success { color: #4bb543; }

        .cars-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .car-card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .car-stats {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.95rem;
        }
        .car-stats div {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <h1>DragX Drag Racing</h1>
    <p id="subtitle" style="color: #aaa; margin-bottom: 25px;">Влез в профила си, за да започнеш</p>

    <!-- Форма за Вход / Регистрация -->
    <div class="card" id="auth-card">
        <h2 id="form-title" style="margin-top: 0;">Вход в играта</h2>
        
        <input type="text" id="username" placeholder="Потребителско име">
        <input type="email" id="email" class="hidden" placeholder="Имейл адрес">
        <input type="password" id="password" placeholder="Парола">
        
        <button id="action-btn" onclick="handleAuth()">Вход</button>
        <button class="switch-btn" onclick="toggleMode()" id="switch-mode-btn">Нямаш акаунт? Регистрирай се</button>
        
        <div class="msg" id="form-msg"></div>
    </div>

    <!-- Игрови панел -->
    <div id="game-panel" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div style="margin-bottom: 25px; font-size: 1.2rem; background: #1e1e1e; padding: 10px 20px; border-radius: 8px; border: 1px solid #333; text-align: center;">
            Пилот: <span id="logged-user" style="color: #e50914; font-weight: bold;"></span> | 
            💰 <span id="logged-money" style="color: #4bb543; font-weight: bold;"></span> лв.
        </div>
        
        <h3 style="margin-bottom: 20px;" id="section-title">Зареждане...</h3>
        <div class="cars-container" id="cars-list"></div>
        <div id="action-msg" class="msg" style="margin-top: 20px; font-weight: bold;"></div>
    </div>

    <script>
        let isLoginMode = true;
        let currentUser = null;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'Вход в играта' : 'Регистрация';
            document.getElementById('action-btn').innerText = isLoginMode ? 'Вход' : 'Регистрирай се';
            document.getElementById('switch-mode-btn').innerText = isLoginMode ? 'Нямаш акаунт? Регистрирай се' : 'Вече имаш акаунт? Влез';
            document.getElementById('form-msg').innerText = '';
            
            const emailInput = document.getElementById('email');
            if (isLoginMode) {
                emailInput.classList.add('hidden');
            } else {
                emailInput.classList.remove('hidden');
            }
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgDiv = document.getElementById('form-msg');

            if (!username || !password || (!isLoginMode && !email)) {
                msgDiv.className = 'msg error';
                msgDiv.innerText = 'Моля, попълни всички задължителни полета!';
                return;
            }

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const payload = isLoginMode ? { username, password } : { username, email, password };

            try {
                const response = await fetch('http://localhost:3000' + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    msgDiv.className = 'msg error';
                    msgDiv.innerText = data.error;
                } else {
                    msgDiv.className = 'msg success';
                    msgDiv.innerText = data.message;

                    if (isLoginMode) {
                        currentUser = data.user;
                        setTimeout(() => {
                            document.getElementById('auth-card').classList.add('hidden');
                            document.getElementById('subtitle').classList.add('hidden');
                            document.getElementById('game-panel').classList.remove('hidden');
                            
                            document.getElementById('logged-user').innerText = currentUser.username;
                            document.getElementById('logged-money').innerText = currentUser.money;
                            
                            // Проверяваме дали потребителят има кола
                            checkUserCar();
                        }, 1000);
                    } else {
                        setTimeout(() => { toggleMode(); }, 1500);
                    }
                }
            } catch (err) {
                msgDiv.className = 'msg error';
                msgDiv.innerText = 'Грешка при връзка със сървъра!';
            }
        }

        // Проверка дали потребителят вече има записана кола
        async function checkUserCar() {
            try {
                const response = await fetch(`http://localhost:3000/api/my-car/${currentUser.id}`);
                const data = await response.json();

                if (data.hasCar) {
                    // Ако има кола, показваме гаража
                    showGarage(data.car.car_name, data.car.hp, data.car.weight);
                } else {
                    // Ако няма, зареждаме списъка с безплатни
                    document.getElementById('section-title').innerText = 'Избери своята първа безплатна кола:';
                    loadFreeCars();
                }
            } catch (err) {
                console.error('Грешка при проверка на гаража:', err);
            }
        }

        async function loadFreeCars() {
            try {
                const response = await fetch('http://localhost:3000/api/free-cars');
                const cars = await response.json();
                const container = document.getElementById('cars-list');
                container.innerHTML = '';

                cars.forEach(car => {
                    container.innerHTML += `
                        <div class="car-card">
                            <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">${car.name}</div>
                            <div class="car-stats">
                                <div>🐎 Мощност: ${car.base_hp} к.с.</div>
                                <div>⚖️ Тегло: ${car.weight_kg} кг</div>
                                <div>💰 Цена: Безплатна</div>
                            </div>
                            <button onclick="selectCar('${car.name}', ${car.base_hp}, ${car.weight_kg})">Вземи в гаража</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Грешка при зареждане на колите:', err);
            }
        }

        async function selectCar(carName, hp, weight) {
            const actionMsg = document.getElementById('action-msg');
            try {
                const response = await fetch('http://localhost:3000/api/buy-car', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        carName: carName,
                        hp: hp,
                        weight: weight
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    actionMsg.className = 'msg error';
                    actionMsg.innerText = data.error;
                } else {
                    actionMsg.className = 'msg success';
                    actionMsg.innerText = data.message;
                    
                    setTimeout(() => {
                        actionMsg.innerText = '';
                        showGarage(carName, hp, weight);
                    }, 1500);
                }
            } catch (err) {
                actionMsg.className = 'msg error';
                actionMsg.innerText = 'Грешка при връзка със сървъра!';
            }
        }

        // Функция за визуализиране на Гаража
        function showGarage(carName, hp, weight) {
            document.getElementById('section-title').innerText = 'Твоят гараж';
            document.getElementById('cars-list').innerHTML = `
                <div class="car-card" style="border-color: #007bff; width: 100%; max-width: 500px; margin: 0 auto;">
                    <div style="font-size: 1.4rem; font-weight: bold; color: #007bff; margin-bottom: 15px;">🚗 ${carName}</div>
                    <div class="car-stats" style="font-size: 1.1rem; text-align: center;">
                        <div>🐎 Мощност: <strong>${hp} к.с.</strong></div>
                        <div>⚖️ Тегло: <strong>${weight} кг</strong></div>
                    </div>
                    
                    <div class="action-btn-group" style="margin-top: 20px;">
                        <button class="btn-blue" onclick="alert('Тунинг магазинът скоро ще бъде отворен!')">🔧 Тунинг</button>
                        <button class="btn-green" onclick="alert('Състезанията скоро ще бъдат активни!')">🏁 Състезавай се</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
