<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragX - Улични Драг Състезания</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0e0e10;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* НАВБАР */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: #16161a;
            border-bottom: 2px solid #ff3300;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo span {
            color: #ff3300;
        }

        .auth-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .auth-box input {
            padding: 7px 12px;
            background: #222228;
            border: 1px solid #3a3a45;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        .auth-box input:focus {
            border-color: #ff3300;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-red {
            background: #ff3300;
            color: #fff;
        }

        .btn-green {
            background: #16a34a;
            color: #fff;
        }

        .btn-gray {
            background: #33333d;
            color: #fff;
        }

        /* СТАТУС БАР */
        .user-stats {
            display: none;
            gap: 18px;
            align-items: center;
            font-size: 14px;
            background: #202026;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .user-stats span {
            color: #ff5500;
            font-weight: bold;
        }

        /* НАЧАЛЕН ЕКРАН */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1f1412 0%, #0e0e10 75%);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
            color: #ff3300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            color: #bbb;
            max-width: 550px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ДЕШБОРД */
        .dashboard {
            display: none;
            flex: 1;
            height: calc(100vh - 58px);
        }

        /* ЛЯВО МЕНЮ */
        .sidebar {
            width: 240px;
            background: #141418;
            border-right: 1px solid #2a2a32;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-btn {
            width: 100%;
            padding: 13px 15px;
            background: #1e1e24;
            color: #ccc;
            border: 1px solid transparent;
            border-radius: 6px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: #282830;
            color: #fff;
        }

        .menu-btn.active {
            background: #ff3300;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 51, 0, 0.3);
        }

        /* ДЯСНА ЧАСТ */
        .content {
            flex: 1;
            padding: 25px;
            background: #18181d;
            overflow-y: auto;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        h2 {
            border-bottom: 2px solid #ff3300;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* КАРТИ И МРЕЖИ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background: #222229;
            border: 1px solid #32323c;
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .card h3 {
            color: #fff;
            font-size: 18px;
        }

        .card p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.4;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            width: fit-content;
        }

        .badge-common { background: #3f3f46; color: #e4e4e7; }
        .badge-rare { background: #1d4ed8; color: #dbeafe; }
        .badge-epic { background: #7e22ce; color: #f3e8ff; }
        .badge-legendary { background: #b45309; color: #fef3c7; }

        /* ГАРАЖ ВИЗУАЛИЗАЦИЯ */
        .garage-showcase {
            background: linear-gradient(180deg, #23232b 0%, #16161b 100%);
            border: 1px solid #353540;
            border-radius: 10px;
            padding: 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .car-visual {
            font-size: 72px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            animation: idleEngine 0.25s infinite alternate;
        }

        @keyframes idleEngine {
            from { transform: translateY(0px); }
            to { transform: translateY(-1.5px); }
        }

        .car-specs {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }

        .spec-box {
            background: #141418;
            padding: 10px 16px;
            border-radius: 6px;
            border-left: 3px solid #ff3300;
        }

        .spec-box small {
            color: #888;
            display: block;
            font-size: 12px;
        }

        .spec-box strong {
            font-size: 18px;
            color: #fff;
        }

        /* ИСТИНСКА АРЕНА ЗА ГОНКА */
        .race-arena {
            background: linear-gradient(180deg, #18181f 0%, #0d0d11 100%);
            border: 2px solid #ff3300;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(255, 51, 0, 0.15);
        }

        .traffic-light {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: #09090b;
            width: fit-content;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .bulb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #27272a;
            transition: 0.15s;
        }

        .bulb.red.on { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .bulb.yellow.on { background: #eab308; box-shadow: 0 0 15px #eab308; }
        .bulb.green.on { background: #22c55e; box-shadow: 0 0 15px #22c55e; }

        .track-asphalt {
            background: #15151a;
            border-radius: 8px;
            padding: 15px 20px;
            position: relative;
            overflow: hidden;
            border-top: 3px solid #333;
            border-bottom: 3px solid #333;
        }

        .lane {
            height: 70px;
            display: flex;
            align-items: center;
            position: relative;
            border-bottom: 2px dashed #3a3a45;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .finish-line {
            position: absolute;
            right: 50px;
            top: 0;
            bottom: 0;
            width: 14px;
            background: repeating-linear-gradient(
                0deg,
                #fff,
                #fff 10px,
                #111 10px,
                #111 20px
            );
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .racer-car-container {
            position: absolute;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: left 0.05s linear;
            z-index: 2;
        }

        .car-icon {
            font-size: 36px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            transform: scaleX(-1);
        }

        @keyframes burnout {
            0% { transform: scaleX(-1) translateY(0px) rotate(0deg); }
            50% { transform: scaleX(-1) translateY(-2px) rotate(-1deg); }
            100% { transform: scaleX(-1) translateY(0px) rotate(1deg); }
        }

        .racer-car-container.burning {
            animation: burnout 0.1s infinite;
        }

        .racer-info-tag {
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #ff5500;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid #444;
        }

        .race-result-banner {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            display: none;
        }

        .win-banner { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #4ade80; }
        .lose-banner { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #f87171; }
    </style>
</head>
<body>

    <!-- ГОРНА ЛЕНТА -->
    <header>
        <div class="logo">DRAG<span>X</span></div>

        <div class="auth-box" id="authSection">
            <input type="text" id="usernameInput" placeholder="Потребител">
            <input type="password" id="passwordInput" placeholder="Парола">
            <button class="btn btn-red" onclick="login()">ВХОД</button>
            <button class="btn btn-gray" onclick="registerUser()">Регистрация</button>
        </div>

        <div class="user-stats" id="statsSection">
            Пилот: <span id="displayName">User</span> | 
            Пари: <span id="displayMoney">1500</span> лв. | 
            Гориво: <span id="displayFuel">100</span>/100 ⛽
            <button class="btn btn-gray" onclick="logout()">Изход</button>
        </div>
    </header>

    <!-- НАЧАЛЕН ЕКРАН -->
    <div class="hero" id="heroSection">
        <h1>УЛИЧНИ ДРАГ СЪСТЕЗАНИЯ</h1>
        <p>Тунинговай колата си, излез на 402 метра и докажи кой е най-бързият на старта срещу мощни съперници!</p>
        <button class="btn btn-green" style="font-size: 16px; padding: 12px 24px;" onclick="demoLogin()">⚡ Бърз Старт (Тест режим)</button>
    </div>

    <!-- ОСНОВЕН РАЗДЕЛ -->
    <div class="dashboard" id="dashboardSection">
        <div class="sidebar">
            <button class="menu-btn active" onclick="switchTab(event, 'tab-garage')">🏎️ Моят Гараж</button>
            <button class="menu-btn" onclick="switchTab(event, 'tab-tuning')">🔧 Тунинг Магазин</button>
            <button class="menu-btn" onclick="switchTab(event, 'tab-tracks')">🏁 Писти & Гонки</button>
            <button class="menu-btn" onclick="switchTab(event, 'tab-shop')">🛒 VIP Магазин</button>
        </div>

        <div class="content">
            <!-- 1. ГАРАЖ -->
            <div id="tab-garage" class="tab-pane active">
                <h2>Моят Гараж</h2>
                <div class="garage-showcase">
                    <div>
                        <span class="badge badge-rare">АКТИВЕН АВТОМОБИЛ</span>
                        <h3 id="carNameDisplay" style="font-size: 26px
